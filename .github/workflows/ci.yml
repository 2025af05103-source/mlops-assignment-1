name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install flake8 black
      - name: Flake8 (critical errors only)
        run: flake8 src scripts tests --select=E9,F63,F7,F82 --show-source
      - name: Black format check
        run: black --check src scripts tests

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download and clean data
        run: python scripts/download_data.py
      - name: Run pytest
        run: pytest tests/ -v --junitxml=artifacts/test-results.xml | tee artifacts/pytest_output.txt
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/

  train:
    name: Model Training
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download and clean data
        run: python scripts/download_data.py
      - name: Train models with MLflow tracking
        run: python src/train.py
      - name: Verify model artifact
        run: test -s models/final_pipeline.joblib && echo "model artifact OK"
      - name: Upload MLflow runs and model
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            mlruns/
            models/
            artifacts/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t heart-disease-api:${{ github.sha }} -f docker/Dockerfile .
      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8000:8000 heart-disease-api:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -sf localhost:8000/health && break || sleep 2
          done
          curl -sf localhost:8000/health | grep -q '"model_loaded":true'
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"age":63,"sex":1,"cp":3,"trestbps":145,"chol":233,"fbs":1,"restecg":0,"thalach":150,"exang":0,"oldpeak":2.3,"slope":0,"ca":0,"thal":1}' \
            | grep -q '"prediction"'
          docker rm -f smoke
